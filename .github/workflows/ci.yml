name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Backend CI
  backend-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        test -f requirements-dev.txt && pip install -r requirements-dev.txt || true
        pip install pytest pytest-cov
        
    - name: Run Backend Tests
      env:
        ENABLE_FAULT_INJECTION: "true"
        PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      run: |
        pytest --cov=services.prompt_service --cov=services.prompt_analyzer --cov=api.endpoints.prompts --cov=core.database --cov=services.test_service --cov=services.test_generator --cov=services.test_runner --cov=services.fault_injector --cov=api.endpoints.tests --cov-report=term-missing
        
  # 2. Frontend CI
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        
    - name: Install Frontend Dependencies
      run: npm install --legacy-peer-deps
      
    - name: Build Angular Application
      # This ensures the typescript compiles without errors before merging to main
      run: npm run build --configuration=production
