<div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mt-8">
    
    <!-- Toolbar -->
    <div class="flex items-center justify-between px-6 py-4 bg-gray-50 border-b border-gray-200">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">
            Architecture Documentation
        </h3>
        
        <button 
            (click)="copyToClipboard()"
            class="flex items-center space-x-2 px-4 py-2 text-sm font-bold rounded-lg transition-all duration-200 active:scale-95"
            [class.bg-green-100]="isCopied()"
            [class.text-green-700]="isCopied()"
            [class.bg-indigo-100]="!isCopied()"
            [class.text-indigo-700]="!isCopied()">
            
            <svg *ngIf="!isCopied()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <svg *ngIf="isCopied()" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span>{{ isCopied() ? 'Copied!' : 'Copy Markdown' }}</span>
        </button>
    </div>

    <!-- Strictly using property binding syntax as requested -->
    <div class="p-8 prose prose-indigo max-w-none" [innerHTML]="parsedHtml"></div>
</div>
